# NOTE: GateR-M debug config — 1-epoch sanity check on RTX 3090
# Used in Phase 4 of the RTX Execution Guide.

seed = 0
batch_size = 256
patience = 16
n_epochs = 1
context_size = 96

[data]
seed = 0
cache = true
path = ":data/california"
num_policy = "quantile"
cat_policy = "__null__"
y_policy = "standard"

[model]
type = "gate_rm"
num_embeddings = "__null__"
d_embedding = 16
n_layers = 2
n_ensembles = 4
context_dropout = 0.0

[optimizer]
type = "AdamW"
lr = 0.001
weight_decay = 0.0
