# NOTE: test config for test_model_step.py — uses minimal hyperparameters
# for fast CPU-based forward pass validation.

seed = 0
batch_size = 32
patience = 16
n_epochs = 1
context_size = 16

[data]
seed = 0
cache = true
path = ":data/california"
num_policy = "quantile"
cat_policy = "__null__"
y_policy = "standard"

[model]
num_embeddings = "__null__"
d_main = 64
context_dropout = 0.0
d_multiplier = 2.0
encoder_n_blocks = 0
predictor_n_blocks = 1
mixer_normalization = "auto"
dropout0 = 0.0
dropout1 = 0.0
normalization = "LayerNorm"
activation = "ReLU"

[optimizer]
type = "AdamW"
lr = 0.001
weight_decay = 0.0
